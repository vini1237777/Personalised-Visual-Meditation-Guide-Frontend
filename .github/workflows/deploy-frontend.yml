name: Deploy REACT App on nginx

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

# One deploy at a time; a newer push waits for the running one to finish.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD_FRONTEND_ENV

    env:
      NODE_VERSION: "22.x"
      REACT_APP_API: ${{ secrets.REACT_APP_API }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      REMOTE_PATH: /var/www/meditation-frontend/Personalised-Visual-Meditation-Guide-Frontend/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend (creates build/)
        run: |
          npm run build
          # Add commands to verify the output folder
          if [ $? -ne 0 ]; then
            echo "Error: npm run build failed."
            exit 1
          fi
          echo "Listing contents of the workspace directory:"
          ls -l
          echo "Listing contents of the build directory:"
          ls -l build/
        env:
          REACT_APP_API: ${{ secrets.REACT_APP_API }}

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY}}

      - name: Add EC2 Host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Fix SSH Permissions on EC2
        run: |
          # The entire run block is executed as a single SSH session on the EC2 host.
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} \
          "echo 'Fixing key file permissions...' && \
           chmod 700 ~/.ssh && \
           chmod 600 ~/.ssh/authorized_keys"

      - name: Check free disk on EC2
        timeout-minutes: 1
        run: |
          used=$(ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "df --output=pcent / | tail -1 | tr -dc 0-9")
          echo "EC2 disk is ${used}% full"
          if [ "$used" -gt 90 ]; then
            echo "::error::EC2 disk is ${used}% full. Free some space before deploying."
            exit 1
          fi

      # rsync sends only changed files, and --delete-after removes files the new
      # build no longer has, once the upload is complete, so the folder Nginx
      # serves always matches this build.
      - name: Upload build folder to EC2
        timeout-minutes: 5
        run: |
          rsync -az --delete-after --stats build/ \
            ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:"${{ env.REMOTE_PATH }}build/"

      - name: Restart Nginx on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "sudo nginx -t && sudo systemctl reload nginx"
